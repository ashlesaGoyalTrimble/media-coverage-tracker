version: '3.8'

services:
  media-coverage-api:
    build: .
    ports:
      - "8002:8002"
    volumes:
      - ./data:/app/data
      - ./Trimble_Media_Coverage_Tracker.xlsx:/app/Trimble_Media_Coverage_Tracker.xlsx
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add a reverse proxy for production
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - media-coverage-api
    restart: unless-stopped
    profiles:
      - production

volumes:
  data:
    driver: local
